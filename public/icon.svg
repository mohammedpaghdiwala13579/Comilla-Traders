<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#312e81" stroke-width="6" opacity="0.6" stroke-dasharray="16 8" />
  <circle cx="256" cy="256" r="196" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.3" />

  <!-- Decorative Compass Nodes -->
  <circle cx="256" cy="46" r="6" fill="#38bdf8" />
  <circle cx="256" cy="466" r="6" fill="#38bdf8" />
  <circle cx="46" cy="256" r="6" fill="#38bdf8" />
  <circle cx="466" cy="256" r="6" fill="#38bdf8" />

  <!-- Center Maritime Anchor Emblem -->
  <!-- Top Ring -->
  <circle cx="256" cy="148" r="34" fill="none" stroke="url(#primaryGrad)" stroke-width="20" filter="url(#glow)" />
  <circle cx="256" cy="148" r="14" fill="#0f172a" />

  <!-- Anchor Stock (Horizontal Crossbar) -->
  <rect x="176" y="196" width="160" height="20" rx="8" fill="url(#primaryGrad)" />
  <circle cx="176" cy="206" r="14" fill="url(#goldGrad)" />
  <circle cx="336" cy="206" r="14" fill="url(#goldGrad)" />

  <!-- Central Shank (Vertical Beam) -->
  <rect x="246" y="180" width="20" height="175" rx="8" fill="url(#primaryGrad)" />

  <!-- Anchor Flukes & Crown (Bottom Arc) -->
  <path d="M 126 270 C 130 380, 382 380, 386 270" fill="none" stroke="url(#primaryGrad)" stroke-width="24" stroke-linecap="round" />

  <!-- Fluke Tips (Triangular Arrowheads) -->
  <polygon points="126,240 100,285 152,285" fill="url(#goldGrad)" />
  <polygon points="386,240 360,285 412,285" fill="url(#goldGrad)" />

  <!-- Crown Base Center -->
  <circle cx="256" cy="375" r="18" fill="url(#goldGrad)" />

  <!-- Brand Typography Badge -->
  <text x="256" y="432" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="4">COMILLA</text>
  <text x="256" y="458" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#38bdf8" letter-spacing="6">OPERATIONS</text>
</svg>
