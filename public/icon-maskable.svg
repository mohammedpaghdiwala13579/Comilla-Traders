<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="mPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="mGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable -->
  <rect width="512" height="512" fill="url(#mBgGrad)" />

  <!-- Inner safe-zone container (scaled to 78%, centered at 256,256) -->
  <g transform="translate(56, 56) scale(0.78)">
    <!-- Ring Accent -->
    <circle cx="256" cy="256" r="210" fill="none" stroke="#312e81" stroke-width="6" opacity="0.6" stroke-dasharray="16 8" />
    <circle cx="256" cy="256" r="196" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.3" />

    <!-- Anchor Top Ring -->
    <circle cx="256" cy="148" r="34" fill="none" stroke="url(#mPrimaryGrad)" stroke-width="20" />
    <circle cx="256" cy="148" r="14" fill="#0f172a" />

    <!-- Crossbar -->
    <rect x="176" y="196" width="160" height="20" rx="8" fill="url(#mPrimaryGrad)" />
    <circle cx="176" cy="206" r="14" fill="url(#mGoldGrad)" />
    <circle cx="336" cy="206" r="14" fill="url(#mGoldGrad)" />

    <!-- Shank -->
    <rect x="246" y="180" width="20" height="175" rx="8" fill="url(#mPrimaryGrad)" />

    <!-- Flukes & Crown -->
    <path d="M 126 270 C 130 380, 382 380, 386 270" fill="none" stroke="url(#mPrimaryGrad)" stroke-width="24" stroke-linecap="round" />

    <!-- Fluke Tips -->
    <polygon points="126,240 100,285 152,285" fill="url(#mGoldGrad)" />
    <polygon points="386,240 360,285 412,285" fill="url(#mGoldGrad)" />

    <!-- Crown Base -->
    <circle cx="256" cy="375" r="18" fill="url(#mGoldGrad)" />

    <!-- Brand Typography Badge -->
    <text x="256" y="432" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="4">COMILLA</text>
    <text x="256" y="458" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#38bdf8" letter-spacing="6">OPERATIONS</text>
  </g>
</svg>
